<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>南京東路三餐輪盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Office version: breakfast, lunch, dinner and drinks around 南京東路二段111號.
   Layout: phone = one column (title, mode, filters, wheel card, result, list).
   Wide screens = wheel column left, searchable list right.
   The wheel shows at most 12 readable slices drawn at random from every place that fits the filters. */
:root {
  --ink: #3E3A39;
  --bg: #FFFCF6; --bg-2: #F7F0E3; --surface: #FFFCF6; --surface-2: #FBF4E8;
  --fg: #3E3A39; --muted: #7B7472; --line: #3E3A39;
  --coral: #F2A497; --yellow: #F6D27A; --water: #A8D3E6; --green: #B9DAA5;
  --accent: #F2A497; --accent-2: #F2A497; --jade: #3E3A39; --jade-deep: #3E3A39; --gold: #F6D27A;
  --s1: #F2A497; --s2: #F6D27A; --s3: #A8D3E6; --s4: #B9DAA5;
  --slice-text: #3E3A39; --shadow: none;
  --font-display: "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Huninn", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(120% 50% at 50% 0%, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
  color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.app { max-width: 1080px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
.play { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 40px; align-items: start; }
  .side { position: sticky; top: 16px; max-height: calc(100vh - 32px); }
  .side .list-wrap { overflow: auto; min-height: 0; flex: 1; padding-right: 4px; }
}

/* Header */
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.line-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.75rem, 7vw, 2.3rem); line-height: 1.15; margin: 2px 0 0; }
h1 em { font-style: normal; color: var(--accent); }
.icon-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="false"] { color: var(--accent); }

/* Mode tabs */
.mode { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); position: relative; }
.mode button { font-family: var(--font-display); font-size: 1.1rem; min-height: 48px; border: 0; border-radius: 0; margin-bottom: -1px;
  background: transparent; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; transition: color .2s, border-color .2s; }
.mode button[aria-selected="true"] { color: var(--jade); border-bottom-color: var(--jade); }

/* Filters: label on the left, pills on the right */
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.frow { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); align-items: center; gap: 8px; }
.frow .lbl { font-size: .8rem; color: var(--muted); font-weight: 500; }
.pills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.walk-pills { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.del-pills { grid-template-columns: minmax(0, 1fr); }
.star-pills { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.star-pills button[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 30%, var(--surface)); border-color: var(--gold); color: var(--fg); }
.xf summary { list-style: none; display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
.xf summary::-webkit-details-marker { display: none; }
.xf summary #filterSum { font-size: .88rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xf summary .chev { width: 9px; height: 9px; margin-right: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
.xf[open] summary .chev { transform: rotate(-135deg); }
.xf-body { display: grid; gap: 12px; padding: 10px 0 4px; }
.fl { display: inline-flex; align-items: center; gap: 4px; }
.fl svg { width: 16px; height: 16px; flex: none; }
.list .tag.deliv { background: transparent; color: var(--jade); box-shadow: inset 0 0 0 1px var(--jade); }
.chip.deliv { background: transparent; color: var(--jade); box-shadow: inset 0 0 0 1px var(--jade); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.chip.deliv svg { width: 13px; height: 13px; }
.pills button { min-height: 46px; padding: 2px 4px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  border-radius: 12px; cursor: pointer; font-weight: 700; font-size: .9rem; line-height: 1.2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background .2s, color .2s, border-color .2s, transform .1s; }
.pills button:active { transform: scale(.97); }
.pills button small { font-weight: 400; font-size: .68rem; opacity: .85; }
.pills button[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: #fff; }
.price-pills button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: var(--accent); color: var(--accent); }
.cat-pills button[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 30%, var(--surface)); border-color: var(--gold); color: var(--fg); }

/* Wheel card */
.wheel-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 14px 14px 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 12px; }
.readout { text-align: center; min-height: 2.2em; display: flex; flex-direction: column; justify-content: center; }
.readout small { font-size: .75rem; color: var(--muted); }
.readout b { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; line-height: 1.25; overflow-wrap: anywhere; }
.stage { position: relative; isolation: isolate; width: 100%; max-width: 400px; margin: 18px auto 0; aspect-ratio: 1; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -4%; width: 13.6%; overflow: visible; transform: translateX(-50%); transform-origin: 50% 30%; z-index: 2;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
.pointer.tick { animation: tick .1s ease-out; }
@keyframes tick { 0% { transform: translateX(-50%) rotate(0); } 40% { transform: translateX(-50%) rotate(-14deg); } 100% { transform: translateX(-50%) rotate(0); } }
.hub { white-space: pre-line; line-height: 1.1; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 24%; aspect-ratio: 1; border-radius: 50%; z-index: 2;
  border: 0; cursor: pointer; color: #fff; font-family: var(--font-display); font-size: clamp(1.1rem, 5vw, 1.45rem);
  background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 62%);
  box-shadow: 0 0 0 5px var(--surface), 0 0 0 9px var(--gold), 0 10px 24px rgba(0,0,0,.35); transition: transform .15s; }
.hub:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.05); }
.hub:active:not(:disabled) { transform: translate(-50%, -50%) scale(.95); }
.hub:disabled { cursor: default; filter: saturate(.75); }
.stage.live::after { content: ""; position: absolute; inset: -4%; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, color-mix(in srgb, var(--gold) 55%, transparent) 40%, transparent 70%); animation: glow .6s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .35; transform: scale(.97); } to { opacity: .9; transform: scale(1.03); } }
.wheel-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.wheel-meta b { color: var(--fg); font-variant-numeric: tabular-nums; }
.ghost { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  cursor: pointer; font-size: .82rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.ghost svg { width: 15px; height: 15px; }
.ghost:disabled { opacity: .45; cursor: default; }
.cta { min-height: 56px; border: 0; border-radius: 16px; cursor: pointer; color: #fff; font-family: var(--font-display); font-size: 1.3rem; letter-spacing: .08em;
  background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000), 0 12px 22px -10px var(--accent);
  transition: transform .1s, box-shadow .1s; }
.cta:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.cta:disabled { cursor: default; filter: grayscale(.4); opacity: .75; }

/* Last result */
.ticket { position: relative; background: var(--surface); border-radius: 18px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 8px;
  border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.ticket::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 14px, var(--gold) 14px 28px); }
.ticket[hidden] { display: none; }
.ticket.win { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { 0% { transform: scale(.94); } 100% { transform: scale(1); } }
.ticket .label { font-size: .75rem; color: var(--muted); }
.ticket .name { font-family: var(--font-display); font-size: clamp(1.4rem, 6vw, 1.7rem); line-height: 1.25; overflow-wrap: anywhere; }
.ticket .hint { color: var(--muted); font-size: .88rem; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--bg-2); color: var(--fg); font-variant-numeric: tabular-nums; }
.chip.walk { background: var(--jade); color: #fff; font-weight: 700; }
.chip.price { color: var(--accent); font-weight: 700; }
.chip.stall, .chip.star { background: var(--gold); color: #3a2a00; font-weight: 700; }
.review { margin: 0; font-size: .9rem; white-space: pre-line; }
.links { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.links .act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; padding: 6px 2px;
  border: 0; border-radius: 12px; background: transparent; color: var(--jade); font: inherit; font-size: .78rem; font-weight: 700; text-decoration: none; cursor: pointer; }
.links .act svg { width: 22px; height: 22px; }
.links .act:hover, .links .act[aria-expanded="true"] { background: color-mix(in srgb, var(--jade) 12%, var(--surface)); }
.ticket .links { border-top: 1px solid var(--line); padding-top: 6px; }
.panel { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 8px; border-radius: 12px; background: var(--surface-2); }
.panel[hidden] { display: none; }
.panel a, .panel button { font: inherit; font-size: .84rem; font-weight: 700; min-height: 40px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; }
.btn-link { font-size: .88rem; font-weight: 700; text-decoration: none; padding: 8px 14px; min-height: 44px; display: inline-flex; align-items: center;
  border-radius: 12px; border: 1px solid var(--jade); color: var(--jade); }
.btn-link.solid { background: var(--jade); color: #fff; }

/* List */
.side-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.side h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; margin: 0; }
.side-head span { font-size: .85rem; color: var(--muted); }
.search { display: flex; gap: 8px; align-items: center; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); white-space: nowrap; cursor: pointer; min-height: 44px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--jade); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
  display: grid; grid-template-columns: 2.8em minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.list li.off { opacity: .45; }
.list li.on-wheel { border-color: color-mix(in srgb, var(--gold) 70%, var(--line)); }
.list .min { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 1.05rem; color: var(--jade); text-align: center; line-height: 1.1; padding-top: 2px; }
.list .min small { display: block; font-weight: 400; font-size: .68rem; color: var(--muted); }
.list .top { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.list .top b { font-weight: 700; }
.list .p { font-size: .75rem; font-weight: 700; color: var(--accent); }
.list .st { font-size: .75rem; font-weight: 700; }
.list .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; }
.list .tag { font-size: .7rem; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--gold); color: #3a2a00; }
.list .tag.bento { background: var(--s4); color: #0d1a2a; }
.list .tag.wheel { background: var(--jade); color: #fff; }
.list .sub { display: block; color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
.list details { font-size: .84rem; margin-top: 2px; }
.list summary { cursor: pointer; color: var(--jade); width: fit-content; font-weight: 500; min-height: 28px; display: flex; align-items: center; }
.list details p { margin: 2px 0; }
.list .gmaps { font-size: .78rem; color: var(--jade); }
.del { font-size: .78rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 4px 10px; min-height: 36px; cursor: pointer; }
.del:hover { color: var(--accent); border-color: var(--accent); }
.more { width: 100%; min-height: 44px; margin-top: 8px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--jade); font-weight: 700; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 20px 0; margin: 0; }

.add { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.add summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: .92rem; min-height: 44px; }
.add form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 0 12px 12px; }
.add input, .add select { font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); min-width: 0; width: 100%; }
.add .full { grid-column: 1 / -1; }
.add button { font-weight: 700; border: 0; border-radius: 12px; padding: 12px; background: var(--jade); color: #fff; cursor: pointer; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .76rem; }
.reset { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.reset.armed { color: var(--accent); border-color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Reveal popup */
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }
body.modal-open { overflow: hidden; }
.reveal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(8, 20, 14, .6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity .25s; }
.reveal.show { opacity: 1; }
.reveal-card { position: relative; width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--surface); color: var(--fg);
  border-radius: 24px; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 30px 60px rgba(0,0,0,.4);
  transform: translateY(24px) scale(.85); transition: transform .45s cubic-bezier(.2, 1.4, .4, 1); }
.reveal.show .reveal-card { transform: none; }
.reveal-top { margin: 0 -18px 4px; padding: 22px 18px 18px; text-align: center; color: #fff; border-radius: 24px 24px 0 0;
  background: radial-gradient(120% 120% at 50% 0%, var(--jade), var(--jade-deep)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ribbon { font-size: .78rem; letter-spacing: .12em; font-weight: 700; color: #2b2100; background: var(--gold); padding: 3px 14px; border-radius: 999px; }
.reveal-name { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 8vw, 2.3rem); line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.reveal-addr { margin: 0; font-size: .82rem; opacity: .85; }
.reveal .chips, .reveal .links { justify-content: center; }
.reveal .review { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.go { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: var(--accent); color: #fff;
  font-weight: 700; font-size: 1.02rem; text-decoration: none; margin-top: 2px; }
.reveal .links { margin-top: 8px; }
.x { position: absolute; top: 10px; right: 10px; z-index: 1; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; }
.x svg { width: 18px; height: 18px; }
.reveal-actions button { font-weight: 700; min-height: 48px; border-radius: 14px; cursor: pointer; }
.reveal-actions .again { background: transparent; border: 1px solid var(--line); color: var(--fg); }
.reveal-actions .ok { background: var(--accent); border: 0; color: #fff; }
@media (prefers-reduced-motion: reduce) {
  .ticket.win, .pointer.tick, .stage.live::after { animation: none; }
  .reveal, .reveal-card { transition: none; }
}

/* ---- Picture-book theme (overrides the base styles above) ---- */
body { background: var(--bg); letter-spacing: .02em; }
h1 em { color: var(--ink); box-shadow: inset 0 -.32em 0 var(--yellow); }
.line-dot { border: 2px solid var(--ink); width: 11px; height: 11px; }
.icon-btn, .filters, .wheel-card, .ticket, .add, .reveal-card { border: 3px solid var(--ink); box-shadow: none; }
.filters, .wheel-card { border-radius: 26px; }
.icon-btn { background: var(--surface); color: var(--ink); }
.icon-btn[aria-pressed="false"] { color: var(--ink); background: var(--coral); }
.hd-side { display: flex; align-items: flex-start; gap: 6px; flex: none; }
.mascot { width: 62px; height: 62px; flex: none; margin-top: -4px; }
.mode { border-bottom: 3px solid var(--ink); }
.mode button { color: var(--muted); margin-bottom: -3px; border-bottom-width: 5px; }
.mode button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--coral); }
.pills button { border: 2.5px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 16px; }
.pills button[aria-pressed="true"], .price-pills button[aria-pressed="true"], .cat-pills button[aria-pressed="true"], .star-pills button[aria-pressed="true"] {
  border-color: var(--ink); color: var(--ink); }
.walk-pills button[aria-pressed="true"] { background: var(--yellow); }
.km-pills button[aria-pressed="true"] { background: var(--water); }
.mode button { font-size: 1rem; }
.walk-pills button { font-size: .84rem; letter-spacing: 0; white-space: nowrap; }
.cat-pills button[aria-pressed="true"] { background: var(--green); }
.star-pills button[aria-pressed="true"] { background: var(--yellow); }
.price-pills button[aria-pressed="true"] { background: var(--coral); }
.del-pills button[aria-pressed="true"] { background: var(--water); }
.pills button small { opacity: 1; color: var(--ink); }
.xf summary .chev { border-color: var(--ink); }
.pointer { filter: none; }
.hub { background: var(--coral); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 0 0 5px var(--surface), 0 0 0 8px var(--ink); }
.stage.live::after { display: none; }
.cta, .go { background: var(--coral); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }

    ctx.fillText('沒有符合條件的店', cx, cy + size * .22);

    wheel.forEach((it, i) => {
      const a0 = rotation + i * seg - Math.PI / 2;
      let c = colors[i % colors.length];
      if (wheel.length % colors.length === 1 && i === wheel.length - 1) c = colors[1];
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + seg); ctx.closePath();

      ctx.lineWidth = lw * .8; ctx.stroke();

      const mid = a0 + seg / 2, flip = Math.cos(mid) < 0;

      ctx.fillStyle = ink; ctx.textAlign = flip ? 'left' : 'right'; ctx.textBaseline = 'middle';
      const maxFs = Math.max(12, Math.min(size * .048, R * seg * .45));

      ctx.restore();

  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.lineWidth = lw; ctx.stroke();

  const dots = 24, dr = size * .0095, rr = (rimOuter + rimInner) / 2;

    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, dr, 0, Math.PI * 2);

      rotation = start + delta + overshoot * (1 - e);
    } else rotation = start + delta;
    const speed = Math.abs(rotation - prev) / seg; prev = rotation;
    if (now - lastBulb > (el < dur1 * .6 ? 60 : 140)) { bulbPhase++; lastBulb = now; }
    const under = Math.floor((((-rotation) % full + full) % full) / seg) % p.length;
    if (under !== lastTickSlice) {
      lastTickSlice = under; $('roName').textContent = p[under].name;
      tick(speed);
    }
    draw();
    if (el < dur1 + dur2) requestAnimationFrame(frame);
    else finish();
  }
  function finish() {
    winner = pick; spinning = false; settling = true; $('stage').classList.remove('live');
    setReadout('轉到了', p[pick].name);
    let n = 0;
    const blink = setInterval(() => {
      flashOn = !flashOn; draw();
      if (++n >= 4) {
        clearInterval(blink); flashOn = true; draw();
        renderList(); showResult(p[pick]);
        if (!reduce) confetti();
        fanfare();
        openReveal(p[pick]); settling = false;
      }
    }, 110);
  }
  requestAnimationFrame(frame);
}

// Skipping only shortens the wait; the winner was already drawn when the spin started.
const go = () => { if (spinning) skipRequested = true; else spin(); };
$('spin').onclick = go;
$('hub').onclick = go;
canvas.addEventListener('click', () => { if (spinning) skipRequested = true; });
$('reroll').onclick = () => { if (!spinning) refresh(true); };
document.querySelectorAll('.walk-pills:not(.km-pills) button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; range = Number(btn.dataset.r); save(); refresh(true); };
});
document.querySelectorAll('.km-pills button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; kmRange = Number(btn.dataset.k); save(); refresh(true); };
});
document.querySelectorAll('.mode button').forEach(btn => {
  btn.onclick = () => { if (spinning || btn.dataset.m === mode) return; mode = btn.dataset.m; clearResult(); refresh(true); };
});
// Multi-select pills; at least one stays on so the wheel is never emptied by accident.
function togglePill(list, v) { return list.includes(v) ? (list.length > 1 ? list.filter(x => x !== v) : list) : [...list, v]; }
document.querySelectorAll('.star-pills button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; minStar = Number(btn.dataset.s); save(); refresh(true); };
});
$('delOnly').onclick = () => { if (spinning) return; deliveryOnly = !deliveryOnly; save(); refresh(true); };
document.querySelectorAll('.cat-pills button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; catOn = togglePill(catOn, btn.dataset.c); save(); refresh(true); };
});
document.querySelectorAll('.price-pills button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; priceOn = togglePill(priceOn, btn.dataset.p); save(); refresh(true); };
});
$('q').addEventListener('input', () => { listLimit = LIST_PAGE; renderList(); });
$('showAll').addEventListener('change', () => { listLimit = LIST_PAGE; renderList(); });
$('more').onclick = () => { listLimit += LIST_PAGE; renderList(); };
for (let m = 1; m <= 20; m++) {
  const o = document.createElement('option'); o.value = m; o.textContent = `走路 ${m} 分`; if (m === 5) o.selected = true; $('fMin').append(o);
}
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('fName').value.trim(); if (!name || spinning) return;
  const meal = $('fKind').value, kind = meal === 'drink' ? 'drink' : 'food';
  items.push({ name, type: $('fType').value.trim(), kind, meals: kind === 'drink' ? '' : meal, cat: kind === 'drink' ? 'restaurant' : $('fCat').value,
    min: Number($('fMin').value), price: $('fPrice').value, addr: '' });
  if (!inMode(items[items.length - 1])) { mode = meal === 'bld' ? 'bl' : meal; clearResult(); }
  $('fName').value = ''; $('fType').value = '';
  save(); refresh(true);
});
let armTimer = null;
$('reset').onclick = () => {
  const btn = $('reset');
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); btn.textContent = '再按一次確認恢復';
    clearTimeout(armTimer); armTimer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = '恢復預設清單'; }, 3000);
    return;
  }
  clearTimeout(armTimer); btn.classList.remove('armed'); btn.textContent = '恢復預設清單';
  items = freshDefaults(); removed = []; save(); refresh(true);
};
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(resize).observe($('stage'));
if (document.fonts) document.fonts.ready.then(draw);
clearResult(); reroll(); renderList(); resize();
</script>
