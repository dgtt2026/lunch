<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>南京東路午餐輪盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: phone = one column (title, mode, filters, wheel card, result, list).
   Wide screens = wheel column left, searchable list right.
   The wheel shows at most 12 readable slices drawn at random from every place that fits the filters. */
:root {
  --bg: #f1f4ef;
  --bg-2: #e4ece4;
  --surface: #ffffff;
  --surface-2: #f6f8f4;
  --fg: #17211b;
  --muted: #5b6b61;
  --line: #d7e0d8;
  --accent: #e2462f;
  --accent-2: #ff8a4c;
  --jade: #157a50;
  --jade-deep: #0d4f34;
  --gold: #f4c64a;
  --s1: #f6c445; --s2: #f08a4b; --s3: #5bb48a; --s4: #6fa3d9; --s5: #e97a8c; --s6: #b99ae0;
  --slice-text: #1a1f1b;
  --shadow: 0 1px 2px rgba(13, 79, 52, .06), 0 14px 32px -18px rgba(13, 79, 52, .4);
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --bg-2: #142019; --surface: #19241e; --surface-2: #1e2b24; --fg: #e9f0ea; --muted: #9db0a3; --line: #2b3a31;
    --accent: #ff6a50; --accent-2: #ff9a62; --jade: #3fbf86; --jade-deep: #0a3524; --gold: #f2c14a;
    --s1: #e0b23a; --s2: #e07c42; --s3: #46a77b; --s4: #5a92cc; --s5: #d76c7d; --s6: #a487d0;
    --slice-text: #10150f; --shadow: 0 14px 32px -18px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --bg-2: #142019; --surface: #19241e; --surface-2: #1e2b24; --fg: #e9f0ea; --muted: #9db0a3; --line: #2b3a31;
  --accent: #ff6a50; --accent-2: #ff9a62; --jade: #3fbf86; --jade-deep: #0a3524; --gold: #f2c14a;
  --s1: #e0b23a; --s2: #e07c42; --s3: #46a77b; --s4: #5a92cc; --s5: #d76c7d; --s6: #a487d0;
  --slice-text: #10150f; --shadow: 0 14px 32px -18px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(120% 50% at 50% 0%, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
  color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.app { max-width: 1080px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
.play { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 40px; align-items: start; }
  .side { position: sticky; top: 16px; max-height: calc(100vh - 32px); }
  .side .list-wrap { overflow: auto; min-height: 0; flex: 1; padding-right: 4px; }
}

/* Header */
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.line-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.75rem, 7vw, 2.3rem); line-height: 1.15; margin: 2px 0 0; }
h1 em { font-style: normal; color: var(--accent); }
.icon-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="false"] { color: var(--accent); }

/* Mode tabs */
.mode { display: grid; grid-template-columns: 1fr 1fr; background: var(--jade-deep); border-radius: 999px; padding: 4px; position: relative; }
.mode button { font-family: var(--font-display); font-size: 1.05rem; min-height: 44px; border: 0; border-radius: 999px;
  background: transparent; color: rgba(255,255,255,.72); cursor: pointer; transition: background .25s, color .25s; }
.mode button[aria-selected="true"] { background: var(--gold); color: #2b2100; }

/* Filters: label on the left, pills on the right */
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.frow { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); align-items: center; gap: 8px; }
.frow .lbl { font-size: .8rem; color: var(--muted); font-weight: 500; }
.pills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pills button { min-height: 40px; padding: 2px 4px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  border-radius: 12px; cursor: pointer; font-weight: 700; font-size: .9rem; line-height: 1.2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background .2s, color .2s, border-color .2s, transform .1s; }
.pills button:active { transform: scale(.97); }
.pills button small { font-weight: 400; font-size: .68rem; opacity: .85; }
.pills button[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: #fff; }
.price-pills button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: var(--accent); color: var(--accent); }
.cat-pills button[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 30%, var(--surface)); border-color: var(--gold); color: var(--fg); }

/* Wheel card */
.wheel-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 14px 14px 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 12px; }
.readout { text-align: center; min-height: 2.2em; display: flex; flex-direction: column; justify-content: center; }
.readout small { font-size: .75rem; color: var(--muted); }
.readout b { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; line-height: 1.25; overflow-wrap: anywhere; }
.stage { position: relative; isolation: isolate; width: 100%; max-width: 400px; margin: 0 auto; aspect-ratio: 1; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -3%; width: 12%; transform: translateX(-50%); transform-origin: 50% 30%; z-index: 2;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
.pointer.tick { animation: tick .1s ease-out; }
@keyframes tick { 0% { transform: translateX(-50%) rotate(0); } 40% { transform: translateX(-50%) rotate(-14deg); } 100% { transform: translateX(-50%) rotate(0); } }
.hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 24%; aspect-ratio: 1; border-radius: 50%; z-index: 2;
  border: 0; cursor: pointer; color: #fff; font-family: var(--font-display); font-size: clamp(1.1rem, 5vw, 1.45rem);
  background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 62%);
  box-shadow: 0 0 0 5px var(--surface), 0 0 0 9px var(--gold), 0 10px 24px rgba(0,0,0,.35); transition: transform .15s; }
.hub:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.05); }
.hub:active:not(:disabled) { transform: translate(-50%, -50%) scale(.95); }
.hub:disabled { cursor: default; filter: saturate(.75); }
.stage.live::after { content: ""; position: absolute; inset: -4%; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, color-mix(in srgb, var(--gold) 55%, transparent) 40%, transparent 70%); animation: glow .6s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .35; transform: scale(.97); } to { opacity: .9; transform: scale(1.03); } }
.wheel-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.wheel-meta b { color: var(--fg); font-variant-numeric: tabular-nums; }
.ghost { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  cursor: pointer; font-size: .82rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.ghost svg { width: 15px; height: 15px; }
.ghost:disabled { opacity: .45; cursor: default; }
.cta { min-height: 56px; border: 0; border-radius: 16px; cursor: pointer; color: #fff; font-family: var(--font-display); font-size: 1.3rem; letter-spacing: .08em;
  background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000), 0 12px 22px -10px var(--accent);
  transition: transform .1s, box-shadow .1s; }
.cta:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.cta:disabled { cursor: default; filter: grayscale(.4); opacity: .75; }

/* Last result */
.ticket { position: relative; background: var(--surface); border-radius: 18px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 8px;
  border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.ticket::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 14px, var(--gold) 14px 28px); }
.ticket.win { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { 0% { transform: scale(.94); } 100% { transform: scale(1); } }
.ticket .label { font-size: .75rem; color: var(--muted); }
.ticket .name { font-family: var(--font-display); font-size: clamp(1.4rem, 6vw, 1.7rem); line-height: 1.25; overflow-wrap: anywhere; }
.ticket .hint { color: var(--muted); font-size: .88rem; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--bg-2); color: var(--fg); font-variant-numeric: tabular-nums; }
.chip.walk { background: var(--jade); color: #fff; font-weight: 700; }
.chip.price { color: var(--accent); font-weight: 700; }
.chip.stall, .chip.star { background: var(--gold); color: #3a2a00; font-weight: 700; }
.review { margin: 0; font-size: .9rem; white-space: pre-line; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-link { font-size: .88rem; font-weight: 700; text-decoration: none; padding: 8px 14px; min-height: 44px; display: inline-flex; align-items: center;
  border-radius: 12px; border: 1px solid var(--jade); color: var(--jade); }
.btn-link.solid { background: var(--jade); color: #fff; }

/* List */
.side-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.side h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; margin: 0; }
.side-head span { font-size: .85rem; color: var(--muted); }
.search { display: flex; gap: 8px; align-items: center; }
.search input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); white-space: nowrap; cursor: pointer; min-height: 44px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--jade); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
  display: grid; grid-template-columns: 2.8em minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.list li.off { opacity: .45; }
.list li.on-wheel { border-color: color-mix(in srgb, var(--gold) 70%, var(--line)); }
.list .min { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 1.05rem; color: var(--jade); text-align: center; line-height: 1.1; padding-top: 2px; }
.list .min small { display: block; font-weight: 400; font-size: .68rem; color: var(--muted); }
.list .top { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.list .top b { font-weight: 700; }
.list .p { font-size: .75rem; font-weight: 700; color: var(--accent); }
.list .st { font-size: .75rem; font-weight: 700; }
.list .tag { font-size: .7rem; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--gold); color: #3a2a00; }
.list .tag.bento { background: var(--s4); color: #0d1a2a; }
.list .tag.wheel { background: var(--jade); color: #fff; }
.list .sub { display: block; color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
.list details { font-size: .84rem; margin-top: 2px; }
.list summary { cursor: pointer; color: var(--jade); width: fit-content; font-weight: 500; min-height: 28px; display: flex; align-items: center; }
.list details p { margin: 2px 0; }
.list .gmaps { font-size: .78rem; color: var(--jade); }
.del { font-size: .78rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 4px 10px; min-height: 36px; cursor: pointer; }
.del:hover { color: var(--accent); border-color: var(--accent); }
.more { width: 100%; min-height: 44px; margin-top: 8px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--jade); font-weight: 700; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 20px 0; margin: 0; }

.add { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.add summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: .92rem; min-height: 44px; }
.add form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 0 12px 12px; }
.add input, .add select { font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); min-width: 0; width: 100%; }
.add .full { grid-column: 1 / -1; }
.add button { font-weight: 700; border: 0; border-radius: 12px; padding: 12px; background: var(--jade); color: #fff; cursor: pointer; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .76rem; }
.reset { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.reset.armed { color: var(--accent); border-color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Reveal popup */
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }
body.modal-open { overflow: hidden; }
.reveal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(8, 20, 14, .6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity .25s; }
.reveal.show { opacity: 1; }
.reveal-card { position: relative; width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--surface); color: var(--fg);
  border-radius: 24px; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 30px 60px rgba(0,0,0,.4);
  transform: translateY(24px) scale(.85); transition: transform .45s cubic-bezier(.2, 1.4, .4, 1); }
.reveal.show .reveal-card { transform: none; }
.reveal-top { margin: 0 -18px 4px; padding: 22px 18px 18px; text-align: center; color: #fff; border-radius: 24px 24px 0 0;
  background: radial-gradient(120% 120% at 50% 0%, var(--jade), var(--jade-deep)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ribbon { font-size: .78rem; letter-spacing: .12em; font-weight: 700; color: #2b2100; background: var(--gold); padding: 3px 14px; border-radius: 999px; }
.reveal-name { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 8vw, 2.3rem); line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.reveal-addr { margin: 0; font-size: .82rem; opacity: .85; }
.reveal .chips, .reveal .links { justify-content: center; }
.reveal .review { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.reveal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.reveal-actions button { font-weight: 700; min-height: 48px; border-radius: 14px; cursor: pointer; }
.reveal-actions .again { background: transparent; border: 1px solid var(--line); color: var(--fg); }
.reveal-actions .ok { background: var(--accent); border: 0; color: #fff; }
@media (prefers-reduced-motion: reduce) {
  .ticket.win, .pointer.tick, .stage.live::after { animation: none; }
  .reveal, .reveal-card { transition: none; }
}
</style>
</head>
<body>

<div class="app">
  <div class="play">
    <header>
      <div>
        <span class="eyebrow"><i class="line-dot" style="background:#008659"></i><i class="line-dot" style="background:#f8b61c"></i>從南京東路二段111號出發</span>
        <h1>今天中午<em id="h1what">吃什麼</em>？</h1>
      </div>
      <button class="icon-btn" id="mute" type="button" aria-label="音效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z"/><path id="muteWave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path id="muteX" d="m16 9 6 6m0-6-6 6"/>
        </svg>
      </button>
    </header>

    <div class="mode" role="tablist" aria-label="輪盤">
      <button type="button" role="tab" data-m="food">午餐</button>
      <button type="button" role="tab" data-m="drink">飲料</button>
    </div>

    <div class="filters">
      <div class="frow">
        <span class="lbl">走路</span>
        <div class="pills walk-pills" role="group" aria-label="步行時間">
          <button type="button" data-r="5">5 分鐘<small id="c5"></small></button>
          <button type="button" data-r="10">10 分鐘<small id="c10"></small></button>
          <button type="button" data-r="15">15 分鐘<small id="c15"></small></button>
        </div>
      </div>
      <div class="frow" id="rowCat">
        <span class="lbl">類型</span>
        <div class="pills cat-pills" role="group" aria-label="類型，可複選">
          <button type="button" data-c="restaurant">餐廳</button>
          <button type="button" data-c="bento">便當</button>
          <button type="button" data-c="stall">小吃攤</button>
        </div>
      </div>
      <div class="frow" id="rowPrice">
        <span class="lbl">預算</span>
        <div class="pills price-pills" role="group" aria-label="預算，可複選">
          <button type="button" data-p="$">$<small>150 以下</small></button>
          <button type="button" data-p="$$">$$<small>150–300</small></button>
          <button type="button" data-p="$$$">$$$<small>300 以上</small></button>
        </div>
      </div>
    </div>

    <section class="wheel-card" aria-label="輪盤">
      <div class="readout" aria-hidden="true"><small id="roLabel">本輪候選</small><b id="roName">按下「開始轉」</b></div>
      <div class="stage" id="stage">
        <canvas id="wheel" role="img" aria-label="午餐輪盤"></canvas>
        <svg class="pointer" id="pointer" viewBox="0 0 60 80" aria-hidden="true">
          <path d="M30 78 L8 26 A24 24 0 1 1 52 26 Z" fill="var(--accent)" stroke="var(--surface)" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="30" cy="24" r="8" fill="var(--gold)"/>
        </svg>
        <button class="hub" id="hub" type="button" aria-label="開始轉">轉！</button>
      </div>
      <div class="wheel-meta">
        <span id="wheelInfo"></span>
        <button class="ghost" id="reroll" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>換一批
        </button>
      </div>
      <button class="cta" id="spin" type="button">開始轉</button>
    </section>

    <div class="ticket" id="ticket" aria-live="polite">
      <span class="label" id="rLabel">上一次轉到</span>
      <span class="name" id="rName">還沒轉</span>
      <p class="hint" id="rHint">選好走路時間和預算，按「開始轉」讓輪盤決定。</p>
      <div class="chips" id="rChips"></div>

  const rows = items.filter(x => x.kind === mode && (showAll || fits(x)))
    .filter(x => !q || [x.name, x.type, x.addr].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (onWheel.has(b) - onWheel.has(a)) || a.min - b.min || (b.rating || 0) - (a.rating || 0));
  const ul = $('list'); ul.innerHTML = '';
  rows.slice(0, listLimit).forEach(it => ul.append(listRow(it, onWheel.has(it))));
  $('empty').hidden = rows.length > 0;
  $('more').hidden = rows.length <= listLimit;
  $('more').textContent = `再顯示 ${Math.min(LIST_PAGE, rows.length - listLimit)} 家（還有 ${rows.length - listLimit} 家）`;

  const n = pool().length, drink = mode === 'drink';
  $('count').textContent = `${n} 家符合條件`;
  $('wheelInfo').innerHTML = n ? `輪盤上 <b>${wheel.length}</b> 家，共 <b>${n}</b> 家符合` : '放寬條件就會有店';
  $('reroll').disabled = spinning || n <= wheel.length;
  [5, 10, 15].forEach(r => { $('c' + r).textContent = `${items.filter(x => x.min <= r && fitsExceptWalk(x)).length} 家`; });
  document.querySelectorAll('.walk-pills button').forEach(btn => btn.setAttribute('aria-pressed', Number(btn.dataset.r) === range));
  document.querySelectorAll('.price-pills button').forEach(btn => btn.setAttribute('aria-pressed', priceOn.includes(btn.dataset.p)));
  document.querySelectorAll('.cat-pills button').forEach(btn => btn.setAttribute('aria-pressed', catOn.includes(btn.dataset.c)));
  document.querySelectorAll('.mode button').forEach(btn => btn.setAttribute('aria-selected', btn.dataset.m === mode));
  $('rowPrice').hidden = drink; $('rowCat').hidden = drink;
  $('listTitle').textContent = drink ? '附近的飲料店' : '附近的午餐';
  $('h1what').textContent = drink ? '喝什麼' : '吃什麼';
  $('spin').disabled = $('hub').disabled = spinning || !wheel.length;
}
// rerollWheel: true when the filters or the list changed, so the wheel must be drawn again from the new pool.
function refresh(rerollWheel) {
  if (rerollWheel) { reroll(); listLimit = LIST_PAGE; setReadout('本輪候選', '按下「開始轉」'); }
  renderList(); draw();
}
function setReadout(label, name) { $('roLabel').textContent = label; $('roName').textContent = name; }

function mapsLink(it, text, cls) {
  const a = document.createElement('a'); a.target = '_blank'; a.rel = 'noopener'; a.className = cls;
  a.href = it.cid ? 'https://maps.google.com/?cid=' + it.cid
    : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(it.name + ' ' + (it.addr || '台北市中山區'));
  a.textContent = text;
  return a;
}
function chip(text, cls) { const c = document.createElement('span'); c.className = 'chip' + (cls ? ' ' + cls : ''); c.textContent = text; return c; }

function fillDetails(it, chipsEl, reviewEl, linksEl) {
  chipsEl.innerHTML = '';
  chipsEl.append(chip(`走路約 ${it.min} 分鐘`, 'walk'));
  if (it.rating) chipsEl.append(chip(`★ ${it.rating.toFixed(1)}（${(it.count || 0).toLocaleString()} 則）`, 'star'));
  if (it.kind === 'food' && it.cat !== 'restaurant') chipsEl.append(chip(CATS[it.cat], 'stall'));
  if (it.kind === 'food') chipsEl.append(chip(it.price + (it.cost ? '　' + it.cost : ''), 'price'));
  if (it.type) chipsEl.append(chip(it.type));
  reviewEl.textContent = (it.review || '') + (it.hours ? (it.review ? '\n' : '') + '營業時間：' + it.hours : '');
  reviewEl.hidden = !it.review && !it.hours;
  linksEl.innerHTML = '';
  const dir = document.createElement('a'); dir.target = '_blank'; dir.rel = 'noopener'; dir.className = 'btn-link solid';
  dir.href = 'https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=' + encodeURIComponent(ORIGIN) +
    '&destination=' + encodeURIComponent(it.name + ' ' + (it.addr || '台北市中山區'));
  dir.textContent = '走路路線';
  linksEl.append(dir, mapsLink(it, 'Google 評論', 'btn-link'));
}

function showResult(it) {
  $('rLabel').textContent = it.kind === 'drink' ? '上一次轉到的飲料' : '上一次轉到的午餐';
  $('rName').textContent = it.name; $('rHint').hidden = true;
  fillDetails(it, $('rChips'), $('rReview'), $('rLinks'));
  const t = $('ticket'); t.classList.remove('win'); void t.offsetWidth; t.classList.add('win');
}
function clearResult() {
  $('rLabel').textContent = '上一次轉到'; $('rName').textContent = '還沒轉'; $('rHint').hidden = false;
  $('rHint').textContent = mode === 'drink' ? '選好走路時間，按「開始轉」讓輪盤決定。' : '選好走路時間和預算，按「開始轉」讓輪盤決定。';
  $('rChips').innerHTML = ''; $('rReview').hidden = true; $('rLinks').innerHTML = '';
}

// ---- Sound: short clicks while spinning, a small fanfare on the reveal. ----
let audio = null, muted = false;
try { muted = localStorage.getItem('nanjing-lunch-muted') === '1'; } catch (e) { /* storage blocked */ }
function ac() {
  if (muted) return null;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}
function beep(freq, len, vol, type = 'triangle', when = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + len);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + len + .02);
}
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => beep(f, .35, .12, 'triangle', i * .1)); }
function renderMute() {
  $('mute').setAttribute('aria-pressed', !muted); $('mute').setAttribute('aria-label', muted ? '音效：關（按一下打開）' : '音效：開（按一下關閉）');
  $('muteWave').style.display = muted ? 'none' : ''; $('muteX').style.display = muted ? '' : 'none';
}
$('mute').onclick = () => {
  muted = !muted; renderMute();
  try { localStorage.setItem('nanjing-lunch-muted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ }
};
renderMute();

function tick(speed) {
  const el = $('pointer'); el.classList.remove('tick'); void el.getBoundingClientRect(); el.classList.add('tick');
  beep(speed > .5 ? 1400 : 900, .03, speed > .5 ? .04 : .09, 'square');
  if (speed < .5 && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { /* vibration unsupported */ } }
}

function confetti() {
  const c = $('confetti'), x = c.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); c.hidden = false;
  const cols = ['--s1', '--s2', '--s3', '--s4', '--s5', '--gold', '--accent'].map(css);
  const bits = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2, y: innerHeight * .4, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
    c: cols[Math.floor(Math.random() * cols.length)],
  }));
  const t0 = performance.now();
  (function fr(now) {
    x.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach(b => { b.vy += .35; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c; x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); x.restore(); });
    if (now - t0 < 2400) requestAnimationFrame(fr); else { x.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}

// ---- Reveal popup ----
let lastFocus = null;
function openReveal(it) {
  $('mLabel').textContent = it.kind === 'drink' ? '今天就喝這家' : '今天中午就吃這家';
  $('mName').textContent = it.name;
  $('mAddr').textContent = it.addr || '';
  fillDetails(it, $('mChips'), $('mReview'), $('mLinks'));
  lastFocus = document.activeElement;
  $('reveal').hidden = false; document.body.classList.add('modal-open');
  requestAnimationFrame(() => requestAnimationFrame(() => $('reveal').classList.add('show')));
  $('mOk').focus({ preventScroll: true });
}
function closeReveal() {
  $('reveal').classList.remove('show'); $('reveal').hidden = true; document.body.classList.remove('modal-open');
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
$('mOk').onclick = closeReveal;
$('mAgain').onclick = () => { closeReveal(); refresh(true); spin(); };
$('reveal').addEventListener('click', e => { if (e.target === $('reveal')) closeReveal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('reveal').hidden) closeReveal(); });

// About 6 seconds at a pace you can follow (top speed about 1.3 turns a second): ease out past the winner, then creep back onto it.
function spin() {
  if (spinning || !wheel.length) return;
  const p = wheel;
  spinning = true; winner = -1; $('stage').classList.add('live'); renderList();
  ac();
  const pick = Math.floor(Math.random() * p.length), seg = Math.PI * 2 / p.length, full = Math.PI * 2;
  // Pointer is at the top; slice i covers rotation + [i, i + 1) * seg.
  const target = -(pick + .5) * seg + (Math.random() * .4 - .3) * seg;
  const current = ((rotation % full) + full) % full;
  let delta = (((target - current) % full) + full) % full;
  // The full spin runs even with the system's reduce-motion setting on (common on iPhones): the wait is the point.
  // That setting only turns off the confetti.
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const overshoot = p.length < 2 ? 0 : Math.min(.6 * seg, .45);
  delta += full * 3;
  const start = rotation, dur1 = 4500 + Math.random() * 300, dur2 = overshoot ? 800 : 0, t0 = performance.now();
  setReadout('轉轉轉…', '');
  let lastBulb = 0, prev = start;
  function frame(now) {
    const el = now - t0;
    if (el < dur1) {
      const t = el / dur1, e = 1 - Math.pow(1 - t, 2.2);
      rotation = start + (delta + overshoot) * e;
    } else if (el < dur1 + dur2) {
      const t = (el - dur1) / dur2, e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      rotation = start + delta + overshoot * (1 - e);
    } else rotation = start + delta;
    const speed = Math.abs(rotation - prev) / seg; prev = rotation;
    if (now - lastBulb > (el < dur1 * .6 ? 60 : 140)) { bulbPhase++; lastBulb = now; }
    const under = Math.floor((((-rotation) % full + full) % full) / seg) % p.length;
    if (under !== lastTickSlice) {
      lastTickSlice = under; $('roName').textContent = p[under].name;
      tick(speed);
    }
    draw();
    if (el < dur1 + dur2) requestAnimationFrame(frame);
    else finish();
  }
  function finish() {
    winner = pick; spinning = false; $('stage').classList.remove('live');
    setReadout('轉到了', p[pick].name);
    let n = 0;
    const blink = setInterval(() => {
      flashOn = !flashOn; draw();
      if (++n >= 4) {
        clearInterval(blink); flashOn = true; draw();
        renderList(); showResult(p[pick]);
        if (!reduce) confetti();
        fanfare();
        openReveal(p[pick]);
      }
    }, 110);
  }
  requestAnimationFrame(frame);
}

$('spin').onclick = spin;
$('hub').onclick = spin;
$('reroll').onclick = () => { if (!spinning) refresh(true); };
document.querySelectorAll('.walk-pills button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; range = Number(btn.dataset.r); save(); refresh(true); };
});
document.querySelectorAll('.mode button').forEach(btn => {
  btn.onclick = () => { if (spinning || btn.dataset.m === mode) return; mode = btn.dataset.m; clearResult(); save(); refresh(true); };
});
// Multi-select pills; at least one stays on so the wheel is never emptied by accident.
function togglePill(list, v) { return list.includes(v) ? (list.length > 1 ? list.filter(x => x !== v) : list) : [...list, v]; }
document.querySelectorAll('.cat-pills button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; catOn = togglePill(catOn, btn.dataset.c); save(); refresh(true); };
});
document.querySelectorAll('.price-pills button').forEach(btn => {
  btn.onclick = () => { if (spinning) return; priceOn = togglePill(priceOn, btn.dataset.p); save(); refresh(true); };
});
$('q').addEventListener('input', () => { listLimit = LIST_PAGE; renderList(); });
$('showAll').addEventListener('change', () => { listLimit = LIST_PAGE; renderList(); });
$('more').onclick = () => { listLimit += LIST_PAGE; renderList(); };
for (let m = 1; m <= 15; m++) {
  const o = document.createElement('option'); o.value = m; o.textContent = `走路 ${m} 分`; if (m === 5) o.selected = true; $('fMin').append(o);
}
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('fName').value.trim(); if (!name || spinning) return;
  const kind = $('fKind').value === 'drink' ? 'drink' : 'food';
  items.push({ name, type: $('fType').value.trim(), kind, cat: kind === 'drink' ? 'restaurant' : $('fCat').value,
    min: Number($('fMin').value), price: $('fPrice').value, addr: '' });
  if (kind !== mode) { mode = kind; clearResult(); }
  $('fName').value = ''; $('fType').value = '';
  save(); refresh(true);
});
let armTimer = null;
$('reset').onclick = () => {
  const btn = $('reset');
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); btn.textContent = '再按一次確認恢復';
    clearTimeout(armTimer); armTimer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = '恢復預設清單'; }, 3000);
    return;
  }
  clearTimeout(armTimer); btn.classList.remove('armed'); btn.textContent = '恢復預設清單';
  items = freshDefaults(); save(); refresh(true);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(resize).observe($('stage'));
if (document.fonts) document.fonts.ready.then(draw);
clearResult(); reroll(); renderList(); resize();
</script>
</body>
